version: '3.9'
services:
  mongodb:
    image: mongo:7
    container_name: invoice-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: invoice_api
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok", "mongodb://localhost:27017/invoice_api"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      invoice-net:
        aliases:
          - mongodb

  invoice-api:
    build:
      context: ./invoice-api
    container_name: invoice-api
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/invoice_api
      SERVER_PORT: 8080
    networks:
      invoice-net:
        aliases:
          - invoice-api

  invoice-front:
    build:
      context: ./invoice-front
    container_name: invoice-front
    depends_on:
      - invoice-api
    ports:
      - "4200:80"
    networks:
      - invoice-net

volumes:
  mongo_data:

networks:
  invoice-net:
    driver: bridge
